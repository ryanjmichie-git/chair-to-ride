[project]
name = "c2r"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "numpy",
    "pyyaml",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "datamodel-code-generator",
    "textstat",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2r"]

[tool.pytest.ini_options]
testpaths = ["evals"]
markers = ["llm: needs ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py312"
